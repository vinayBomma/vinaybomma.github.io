<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join my Greenlit Film Festival</title>
  <meta name="description" content="You're invited to a Greenlit Film Festival. Same budget, same rules, biggest box office wins." />
  <meta property="og:title" content="Join my Greenlit Film Festival" />
  <meta property="og:description" content="Same budget, same rules, biggest box office wins." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #070A11; color: #F7F8FB; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px; border-radius: 20px; text-align: center;
      background: #111722; border: 1px solid #3A4A63;
    }
    .kicker { color: #E5B94B; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 26px; margin: 8px 0 6px; }
    p { color: #AAB4C5; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    .code {
      font-size: 36px; font-weight: 700; letter-spacing: .3em; padding: 14px 0 14px .3em;
      border-radius: 14px; background: #192231; margin-bottom: 20px; user-select: all;
    }
    a.button {
      display: block; padding: 15px; border-radius: 14px; font-weight: 600; font-size: 16px;
      text-decoration: none; margin-top: 10px;
    }
    .primary { background: #E5B94B; color: #171005; }
    .ghost { border: 1px solid #3A4A63; color: #F7F8FB; }
    .hint { font-size: 13px; color: #6E7B91; margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Greenlit Film Festival</div>
    <h1>You're invited</h1>
    <p>Same budget, same rules. Produce the biggest box office hit to win.</p>
    <div class="code" id="code">------</div>
    <a class="button primary" id="open" href="greenlit://festivals">Open in Greenlit</a>
    <a class="button ghost" id="ios" href="https://apps.apple.com/us/app/greenlit-movie-producer-game/id6787692845">Download on the App Store</a>
    <a class="button ghost" id="android" href="https://play.google.com/store/apps/details?id=com.vinaybomma.greenlit">Get it on Google Play</a>
    <p class="hint">New to Greenlit? Install it, tap Join under Film Festival, and enter the room code.</p>
  </main>
  <script>
    (function () {
      var raw = new URLSearchParams(window.location.search).get('code') || '';
      var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) return;
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = 'greenlit://festival/' + code;
      var ua = navigator.userAgent || '';
      if (/android/i.test(ua)) document.getElementById('ios').style.display = 'none';
      if (/iphone|ipad|ipod/i.test(ua)) document.getElementById('android').style.display = 'none';
    })();
  </script>
</body>
</html>
